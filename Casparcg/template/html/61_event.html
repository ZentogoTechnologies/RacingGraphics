<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Event</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/event.css">

    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>

<body>

    <div
        class="overlay"
        id="overlay">

        <!-- PANEL LOGO -->

        <div class="logo-box">

            <img
                id="logo"
                src="../img/logo-cliente.png"
                alt="Autódromo Panamá">

        </div>

        <!-- PANEL INFORMACIÓN -->

        <div
            class="info-panel"
            id="eventPanel">

            <div class="content-section">

                <div
                    class="event-label"
                    id="label">

                    EVENTO

                </div>

                <div
                    class="event-name"
                    id="eventName">

                    Nombre del evento

                </div>

            </div>

        </div>

        <!-- Logo del campeonato, fuera del panel a propósito. Dentro
             competía con el texto por el ancho animado del panel y
             acababa montándose encima. Aquí es un tercer bloque de la
             barra: autódromo, nombre, evento. -->
        <div
            class="event-logo"
            id="eventLogoBox">

            <img
                id="eventLogo"
                src=""
                alt="">

        </div>

    </div>

<script>

/* Un nombre como "GT Challenge de las Américas" no cabe en el panel de
   700px que servía para "Prospec Series". En vez de recortarlo, el panel
   crece hasta un tope; si ni así entra, baja el cuerpo de letra. */

const ANCHO_MIN  = 700;
const ANCHO_MAX  = 1180;
const RELLENO    = 70;      /* los 35px de padding a cada lado */
const CUERPO_MAX = 50;
const CUERPO_MIN = 30;


function ajustarPanel(){

    const panel   = document.getElementById("eventPanel");
    const seccion = document.querySelector(".content-section");
    const nombre  = document.getElementById("eventName");

    if(!panel || !seccion || !nombre) return;

    /* Se parte siempre del cuerpo grande: si antes hubo un nombre largo,
       el siguiente no tiene por qué heredar su letra pequeña. */
    nombre.style.fontSize = CUERPO_MAX + "px";

    const DISPONIBLE = ANCHO_MAX - RELLENO;

    /* Se mide con scrollWidth y no con el rectángulo: el max-width del
       CSS recorta la caja, así que el rectángulo nunca pasaría del tope
       y el bucle no llegaría a encoger nada. scrollWidth sí devuelve lo
       que ocupa el texto de verdad. */

    let cuerpo = CUERPO_MAX;

    /* Se baja de dos en dos y se vuelve a medir. Calcularlo de una vez
       con una regla de tres falla: el ancho no es lineal con el cuerpo.
       Son doce pasadas en el peor caso, y solo al cambiar el nombre. */
    while(nombre.scrollWidth > DISPONIBLE && cuerpo > CUERPO_MIN){

        cuerpo -= 2;

        nombre.style.fontSize = cuerpo + "px";
    }

    /* El rótulo también cuenta: con un nombre corto y un rótulo largo,
       quien manda es el rótulo. */
    const etiqueta = document.getElementById("label");
    const texto = Math.max(
        nombre.scrollWidth,
        etiqueta ? etiqueta.scrollWidth : 0);

    const total = Math.min(
        ANCHO_MAX,
        Math.max(ANCHO_MIN, Math.ceil(texto) + RELLENO));

    panel.style.setProperty("--panel-w", total + "px");
}


function update(data){
    /* CasparCG 2.5 entrega el payload del CG ADD/UPDATE como texto JSON,
       no como objeto. Sin este parseo data.<campo> siempre era undefined
       y la plantilla se quedaba con sus valores por defecto. */

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }


    if(data.label !== undefined)
        document.getElementById("label").textContent =
            data.label.toUpperCase();

    /* El nombre va tal cual está escrito en la base. "GT Challenge de
       las Américas" en versales pierde las mayúsculas que sí importan y
       queda un bloque de letras difícil de leer de un vistazo. */
    if(data.event !== undefined)
        document.getElementById("eventName").textContent =
            data.event;

    if(data.logo !== undefined)
        document.getElementById("logo").src =
            data.logo;

    /* La imagen del evento. Sin ella se esconde el bloque entero en vez
       de dejar un recuadro vacío al final del panel. */
    if(data.event_image !== undefined){

        const caja = document.getElementById("eventLogoBox");
        const img  = document.getElementById("eventLogo");

        if(data.event_image){
            img.src = data.event_image;
            caja.style.display = "flex";
        } else {
            img.removeAttribute("src");
            caja.style.display = "none";
        }
    }

    /* Después de escribir, no antes: el ancho depende del texto que
       acaba de entrar. */
    ajustarPanel();
}

function play(){

    ajustarPanel();

    const widget =
        document.getElementById("overlay");

    const panel =
        document.getElementById("eventPanel");

    widget.style.animation =
        "slideUp .5s ease forwards";

    setTimeout(() => {

        panel.style.animation =
            "expandPanel .6s ease forwards";

    },500);
}

function stop(){

    const widget =
        document.getElementById("overlay");

    const panel =
        document.getElementById("eventPanel");

    panel.style.animation =
        "collapsePanel .5s ease forwards";

    setTimeout(() => {

        widget.style.animation =
            "slideDown .5s ease forwards";

    },500);
}

window.onload = function(){

    play();
};

</script>

</body>
</html>
