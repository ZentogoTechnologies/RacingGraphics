<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grilla con Fotos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/grilla_fotos.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="gf" id="gf">

        <div class="gf-cabecera">
            <div class="gf-evento" id="evento">Autódromo Panamá</div>
            <div class="gf-titulo" id="titulo" data-t="grilla.titulo">Grilla de Partida</div>
            <div class="gf-categoria" id="categoria"></div>
        </div>

        <div class="gf-pareja" id="pareja"></div>

        <!-- La parrilla dibujada, en el hueco que dejan las dos caras.
             Va aparte de .gf-pareja porque los lados se animan con un
             transform y eso crea contexto de apilado: dentro, el dibujo
             quedaria por debajo del velo oscuro. -->
        <div class="gf-pista" id="pista"></div>

        <div class="gf-paso" id="paso"></div>

    </div>

<script>

/* ==========================================================================
   GRILLA DE PARTIDA CON FOTOS

   Los mismos datos que la de nombres, pero de dos en dos y con la cara.
   Mientras aquella sirve para buscarse en una lista de treinta, esta sirve
   para mirar a los que salen juntos en una misma fila de la parrilla.
========================================================================== */

/* Una fila de la parrilla: los dos que salen a la vez. */
const POR_PAGINA = 2;

/* Lo mismo que la de nombres. */
const ESPERA = 5000;

let parrilla = [];
let pagina   = 0;
let relevo   = null;

function escapar(t){
    return String(t == null ? "" : t)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

/* 1º, 2º, 3º... El ordinal se arma aqui y no viene del backend: depende
   del idioma y el backend manda solo el numero. */
function ordinal(pos){
    const n = parseInt(pos, 10);
    if (!n) return "";
    const es = (window.TEXTOS && window.TEXTOS.grilla && window.TEXTOS.grilla.titulo || "")
                 .toLowerCase().includes("starting");
    if (!es) return "º";
    const resto100 = n % 100, resto10 = n % 10;
    if (resto100 >= 11 && resto100 <= 13) return "TH";
    return ["TH","ST","ND","RD"][resto10] || "TH";
}

function lado(p, clase){

    if (!p) return `<div class="gf-lado ${clase}"></div>`;

    const foto = p.photo
        ? `<img class="gf-foto" src="${escapar(p.photo)}" alt="">`
        : `<img class="gf-foto sin" src="../img/pilot.png" alt="">`;

    return `<div class="gf-lado ${clase}">${foto}</div>`;
}

/* Los datos van aparte de la foto y no dentro. El lado se anima con un
   transform, que crea contexto de apilado, y ahi dentro el velo oscuro del
   contenedor tapaba el nombre por mucho z-index que se le pusiera. */
function datos(p, clase){

    if (!p) return "";

    /* El apellido manda y el nombre de pila lo acompaña arriba, como en
       cualquier presentacion de parrilla. */
    const apellido = (p.last_name || p.full_name || "").trim().toUpperCase();
    const nombre   = (p.name || "").trim();

    const tiempo = p.best_time
        ? `<div class="gf-tiempo">${escapar(p.best_time)}</div>` : "";

    return `<div class="gf-datos ${clase}">`
         +   `<div class="gf-pos">`
         +     `<span class="gf-pos-num">${escapar(p.position)}</span>`
         +     `<span class="gf-pos-suf">${ordinal(p.position)}</span>`
         +   `</div>`
         +   `<div class="gf-quien">`
         +     (nombre ? `<div class="gf-nombre">${escapar(nombre)}</div>` : "")
         +     `<div class="gf-apellido">${escapar(apellido)}</div>`
         +     tiempo
         +   `</div>`
         + `</div>`;
}

/* ==========================================================================
   LA PARRILLA DIBUJADA

   El hueco entre las dos caras se ocupa con la parrilla vista en
   perspectiva: los dos que se estan presentando delante, y detras los que
   arrancan pegados a ellos. Es lo mismo que hace la F1 y sirve para lo
   mismo: situar de un vistazo donde queda cada uno.

   No hace falta ningun dato nuevo. Los nombres cambian de carrera en
   carrera, si, pero salen de la misma lista que ya alimenta las caras y
   los tiempos, y esa lista la arma el backend leyendo el current.xml del
   cronometraje y cruzando los apellidos con la base. El dibujo solo mira
   la lista que ya esta aqui.

   Se dibuja con una perspectiva de un punto de fuga, no con cajas puestas
   a ojo. Con las medidas a ojo, cambiar cuantas filas se ven obliga a
   recolocarlo todo; con la proyeccion basta con pedir mas filas.
========================================================================== */

/* Cuantas filas de parrilla se ven: la de los dos presentados y las de
   detras. Tres es lo que cabe sin que la ultima quede tan pequeña que no
   se lea el apellido. */
const PISTA_FILAS = 3;

/* La proyeccion. `z` es la profundidad en cajas de parrilla, `x` el
   desvio lateral respecto al eje de la pista.

   El punto de fuga queda por encima del lienzo a proposito: asi los
   bordes de la pista salen por arriba en vez de juntarse a la vista,
   que es como se ve una recta de verdad y como esta en la referencia. */
const PISTA = {
    ancho:     700,   /* el lienzo, mas ancho que alto como el hueco */
    alto:      540,
    horizonte:-140,   /* fuera del lienzo, por arriba */
    frente:    510,   /* la y del borde de abajo, lo mas cerca */
    fuga:      .42,   /* cuanto encoge por unidad de profundidad */
    escalaX:   170,   /* pixeles por unidad lateral en primer plano */

    media:     1.75,  /* media anchura de la pista */
    cordon:     .16,  /* lo que sobresale el piano por fuera del borde */
    columna:    .72,  /* desvio del centro de cada columna de cajas */
    ancha:      .58,  /* media anchura de una caja */
    honda:      .80,  /* lo que mide una caja de fondo */
    ala:        .55,  /* que parte de ese fondo dibujan los lados */
    fila:       .95,  /* de una fila a la siguiente */
    escalon:    .45,  /* lo que la columna derecha va por detras */
    salida:     .15,  /* donde empieza la primera caja */
    meta:       .02,  /* la linea de meta, justo delante de la primera */
    tramos:      14,  /* en cuantos trozos se parte cada piano */
};


function pistaProyectar(x, z){

    const k = 1 / (1 + z * PISTA.fuga);

    return {
        x: PISTA.ancho / 2 + x * PISTA.escalaX * k,
        y: PISTA.horizonte + (PISTA.frente - PISTA.horizonte) * k,
        k: k,
    };
}


/* Un cuadrilatero del suelo, proyectado. Sirve para los pianos y para el
   relleno de la caja de los que se presentan. */
function pistaSuelo(x0, x1, z0, z1){

    const a = pistaProyectar(x0, z0);
    const b = pistaProyectar(x1, z0);
    const c = pistaProyectar(x1, z1);
    const d = pistaProyectar(x0, z1);

    return `${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}`;
}


/* El sitio de un piloto en la parrilla. No es una caja cerrada sino la
   marca de verdad: la linea de delante y los dos costados, abierta por
   detras, que es como esta pintada en el asfalto y como se ve en la
   referencia. */
function pistaSitio(centroX, z0){

    const z1 = z0 + PISTA.honda;
    const zAla = z0 + PISTA.honda * PISTA.ala;

    const izqCerca  = pistaProyectar(centroX - PISTA.ancha, z0);
    const derCerca  = pistaProyectar(centroX + PISTA.ancha, z0);
    const izqLejos  = pistaProyectar(centroX - PISTA.ancha, zAla);
    const derLejos  = pistaProyectar(centroX + PISTA.ancha, zAla);

    return {
        /* De la punta de un costado, al frente, y a la punta del otro. */
        linea: `${izqLejos.x},${izqLejos.y} ${izqCerca.x},${izqCerca.y} `
             + `${derCerca.x},${derCerca.y} ${derLejos.x},${derLejos.y}`,

        relleno: pistaSuelo(centroX - PISTA.ancha, centroX + PISTA.ancha, z0, z1),

        /* El apellido se cuelga de la punta del costado. */
        puntaIzq: izqLejos.x,
        puntaDer: derLejos.x,
        puntaY:   izqLejos.y,
        k:        izqLejos.k,
    };
}


function pistaDibujar(){

    const destino = document.getElementById("pista");
    if (!destino) return;

    /* Se empieza por el primero de los dos que se estan presentando. Los
       de detras son los que siguen en la lista, sin mas. */
    const desde = pagina * POR_PAGINA;

    /* Sin al menos la fila de delante no hay nada que dibujar. */
    if (!parrilla[desde]) { destino.innerHTML = ""; return; }

    const fondoZ = PISTA.salida + PISTA_FILAS * PISTA.fila + PISTA.escalon;

    let svg = `<svg viewBox="0 0 ${PISTA.ancho} ${PISTA.alto}" `
            + `preserveAspectRatio="xMidYMid meet">`;

    /* El resplandor. Es lo que hace que el rojo y el blanco de los pianos
       se lean como neon y no como dos colores planos. */
    svg += `<defs><filter id="piNeon" x="-40%" y="-40%" width="180%" height="180%">`
         + `<feGaussianBlur stdDeviation="3" result="halo"/>`
         + `<feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/>`
         + `<feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

    /* ── Los pianos ──────────────────────────────────────────────
       Rojo y blanco alternos por fuera de cada borde. Decoran los
       lados, que era lo que se pedia, y de paso dicen donde acaba la
       pista mejor que una raya sola. Van a tramos iguales en
       profundidad, asi que la perspectiva los acorta sola segun se
       alejan, que es lo que hace que se lean como suelo. */
    svg += `<g filter="url(#piNeon)">`;

    for (const lado of [-1, 1]) {
        for (let i = 0; i < PISTA.tramos; i++) {

            const z0 = fondoZ * (i / PISTA.tramos);
            const z1 = fondoZ * ((i + 1) / PISTA.tramos);

            const dentro = lado * PISTA.media;
            const fuera  = lado * (PISTA.media + PISTA.cordon);

            svg += `<polygon class="pi-piano ${i % 2 ? "blanco" : "rojo"}" `
                 + `points="${pistaSuelo(dentro, fuera, z0, z1)}"/>`;
        }
    }

    svg += `</g>`;

    /* Los bordes de la pista, por dentro del piano. */
    for (const lado of [-1, 1]) {
        const cerca = pistaProyectar(lado * PISTA.media, 0);
        const lejos = pistaProyectar(lado * PISTA.media, fondoZ);
        svg += `<line class="pi-borde" x1="${cerca.x}" y1="${cerca.y}" `
             + `x2="${lejos.x}" y2="${lejos.y}"/>`;
    }

    /* ── La linea de meta ────────────────────────────────────────
       Solo cuando delante van el primero y el segundo. Es lo que dice
       que esos dos son los de la pole sin escribirlo; en el resto de
       las parejas seria mentira, porque tienen filas por delante. */
    if (pagina === 0) {
        svg += `<g filter="url(#piNeon)">`
             + `<polygon class="pi-meta" points="`
             + pistaSuelo(-PISTA.media, PISTA.media,
                          PISTA.meta, PISTA.meta + .07) + `"/></g>`;
    }

    /* De atras hacia delante: asi las de delante, que son mas grandes, se
       pintan encima de las de atras y no al reves. */
    for (let fila = PISTA_FILAS - 1; fila >= 0; fila--) {
        for (let lado = 1; lado >= 0; lado--) {

            const piloto = parrilla[desde + fila * 2 + lado];
            if (!piloto) continue;

            /* Las impares delante y las pares medio cuerpo por detras,
               que es como se forma una parrilla de verdad. */
            const z0 = PISTA.salida + fila * PISTA.fila + lado * PISTA.escalon;
            const signo = lado === 0 ? -1 : 1;

            const sitio = pistaSitio(signo * PISTA.columna, z0);

            /* La fila de delante es la de los dos que se presentan. */
            const suya = fila === 0 ? " destacada" : "";

            /* El relleno solo en la suya y sin filo: marca de quien se
               habla sin volver a cerrar la caja. */
            if (fila === 0) {
                svg += `<polygon class="pi-suelo" points="${sitio.relleno}"/>`;
            }

            svg += `<polyline class="pi-sitio${suya}" points="${sitio.linea}"/>`;

            const apellido = (piloto.last_name || piloto.full_name || "")
                             .trim().toUpperCase();
            if (!apellido) continue;

            /* Por fuera de su sitio, hacia el borde de la pista: en medio
               se montaria con el de al lado. */
            const x = signo < 0 ? sitio.puntaIzq - 12 : sitio.puntaDer + 12;
            const anclaje = signo < 0 ? "end" : "start";
            const cuerpo = (34 * sitio.k).toFixed(1);

            svg += `<text class="pi-nombre${suya}" x="${x}" y="${sitio.puntaY}" `
                 + `text-anchor="${anclaje}" font-size="${cuerpo}">`
                 + escapar(apellido) + `</text>`;
        }
    }

    svg += `</svg>`;

    destino.innerHTML = svg;
}


function cuantasPaginas(){
    return Math.max(1, Math.ceil(parrilla.length / POR_PAGINA));
}

function pintarPaso(){

    const paso = document.getElementById("paso");
    if (!paso) return;

    if (parrilla.length <= POR_PAGINA) { paso.innerHTML = ""; return; }

    const desde = pagina * POR_PAGINA + 1;
    const hasta = Math.min(parrilla.length, desde + POR_PAGINA - 1);
    const de = T("grilla.de", "de");

    let puntos = "";
    for (let i = 0; i < cuantasPaginas(); i++)
        puntos += `<span class="gf-punto${i === pagina ? " activo" : ""}"></span>`;

    paso.innerHTML = `<span class="gf-rango">${desde} – ${hasta} ${de} ${parrilla.length}</span>`
                   + `<span class="gf-puntos">${puntos}</span>`;
}

function pintar(){

    const destino = document.getElementById("pareja");
    if (!destino) return;

    const par = parrilla.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);

    destino.innerHTML = lado(par[0], "izq") + lado(par[1], "der")
                      + datos(par[0], "izq") + datos(par[1], "der");
    pintarPaso();

    /* Cada uno entra desde su lado. Se arranca aqui porque los nodos
       acaban de nacer: puesta en el CSS, la animacion no se veria al
       relevar, solo la primera vez. */
    const lados = destino.querySelectorAll(".gf-lado");
    if (lados[0]) lados[0].style.animation = "gfLadoIzq .55s ease forwards";
    if (lados[1]) lados[1].style.animation = "gfLadoDer .55s ease forwards";

    /* La parrilla dibujada cambia con la pareja: delante van los dos que
       se presentan y detras los que arrancan pegados a ellos. */
    pistaDibujar();
}

function pararRelevo(){
    if (relevo) { clearInterval(relevo); relevo = null; }
}

function arrancarRelevo(){

    pararRelevo();

    /* Con dos o menos no hay nada que relevar. */
    if (parrilla.length <= POR_PAGINA) return;

    relevo = setInterval(() => {
        pagina = (pagina + 1) % cuantasPaginas();
        pintar();
    }, ESPERA);
}

function update(data){
    try{
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});

        if (d.subtitle !== undefined) document.getElementById("evento").textContent = d.subtitle;
        if (d.title    !== undefined) document.getElementById("titulo").textContent = d.title;
        if (d.category !== undefined) document.getElementById("categoria").textContent =
            (d.category || "").toUpperCase();

        if (d.drivers !== undefined) {
            parrilla = Array.isArray(d.drivers) ? d.drivers : [];
            pagina = 0;
            pintar();
            arrancarRelevo();
        }
    }catch(e){ /* un UPDATE con basura no puede tumbar el grafico */ }
}

function play(){
    document.getElementById("gf").style.animation = "gfEntra .5s ease forwards";
}

function stop(){
    /* Sin esto el intervalo sigue latiendo con el grafico fuera de aire. */
    pararRelevo();
    document.getElementById("gf").style.animation = "gfSale .4s ease forwards";
}

if (!window.__casparcg) { play(); }

</script>

</body>
</html>
