<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportero</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/narrator.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/entrada.js"></script>
</head>

<body>

    <div class="narrator" id="narrator">

        <!-- LOGO -->
        <div class="narrator-logo">
            <img
                id="logo"
                src="../img/logo-cliente.png"
                alt="Logo"
            >
        </div>

        <!-- INFORMACIÓN -->
        <div class="narrator-info">

            <!-- ROL -->
            <div
                class="narrator-role"
                id="role">
                REPORTERO
            </div>

            <!-- NOMBRE -->
            <div
                class="narrator-name"
                id="name">
                Nombre del reportero
            </div>

            <!-- TEXTO -->
            <div
                class="narrator-text"
                id="text">
                Bienvenidos a la carrera.
            </div>

        </div>

    </div>


    <script>

        function update(data) {
    /* CasparCG 2.5 entrega el payload del CG ADD/UPDATE como texto JSON,
       no como objeto. Sin este parseo data.<campo> siempre era undefined
       y la plantilla se quedaba con sus valores por defecto. */

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }


            if (data.role !== undefined) {
                document.getElementById("role").textContent =
                    data.role.toUpperCase();
            }

            if (data.name !== undefined) {
                document.getElementById("name").textContent =
                    data.name.toUpperCase();
            }

            if (data.text !== undefined) {
                document.getElementById("text").textContent =
                    data.text;
            }

            if (data.logo !== undefined) {
                document.getElementById("logo").src =
                    data.logo;
            }

        }

    

        /* ==================================================================
           PLAY / STOP
           CasparCG las llama al cargar (play-on-load) y con CG STOP.
        ================================================================== */

        function play() {
            entradaCancelarAuto();

            /* Se espera a que la tipografia este cargada y las imagenes
               completas antes de desplegar. Sin esto la barra se abria
               vacia y el logo aparecia de golpe a mitad de la animacion;
               el clima se veia bien porque es la unica sin imagenes. Hay
               tope: si algo no llega, la barra sale igual sin esa pieza. */
            entradaCuandoListo(document.body, () => {

                const widget = document.getElementById("narrator");
                const panel  = document.querySelector(".narrator-info");

                widget.style.animation = "slideUp .5s ease forwards";

                /* El panel espera a que el conjunto termine de subir: si
                   se abren a la vez, el texto sale volando en diagonal en
                   vez de desplegarse desde el logo. */
                setTimeout(() => {
                    panel.style.animation = "expandPanel .6s ease forwards";
                }, 500);
            });
        }

        function stop() {

            const widget = document.getElementById("narrator");
            const panel  = document.querySelector(".narrator-info");

            panel.style.animation = "collapsePanel .5s ease forwards";

            setTimeout(() => {
                widget.style.animation = "slideDown .5s ease forwards";
            }, 500);
        }

        /* Arranque automatico solo para verlo en un navegador. Dentro de
           CasparCG el CG ADD llama a play() antes de que salte, y play() lo
           cancela: sin esto la barra salia primero con el texto de relleno
           y volvia a entrar al llegar los datos, que es el amague. */
        window.onload = function(){
            entradaAutoNavegador(play);
        };
</script>

</body>

</html>
