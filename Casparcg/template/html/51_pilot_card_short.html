<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pilot Card Short</title>

    <link rel="stylesheet" href="../css/tipografia.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/pilot_card_short.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>

<body>

    <div class="pilot-short" id="pilotShort">

        <div class="brand-panel">
            <img id="brandLogo" class="brand-logo" src="../img/team_logo.png">
        </div>

        <div class="pilot-panel" id="pilotPanel">

            <div class="content-section">

                <div class="name-row">
                    <div class="pilot-name" id="pilotName">JIMMY LLIBRE</div>
                    <div class="car-number" id="carNumber">#43</div>
                </div>

                <div class="info-row">
                    <div class="info-block">
                        <div class="label" data-t="carta.categoria">CATEGORÍA</div>
                        <div class="value" id="category">GT Challenge</div>
                    </div>
                    <div class="info-block">
                        <div class="label" data-t="carta.subcategoria">SUBCATEGORÍA</div>
                        <div class="value acento" id="subCategory">GTS Light</div>
                    </div>
                    <div class="info-block">
                        <div class="label" data-t="carta.vehiculo">VEHÍCULO</div>
                        <div class="value" id="vehicle">Porsche</div>
                    </div>
                </div>

                <div class="info-row segunda">
                    <div class="info-block">
                        <div class="label" data-t="carta.equipo">EQUIPO</div>
                        <div class="value" id="team">VERDE</div>
                    </div>
                    <div class="info-block">
                        <div class="label" data-t="carta.pais">PAÍS</div>
                        <img class="bandera" id="country" src="../img/banderas/pa.svg">
                    </div>
                </div>

            </div>

            <div class="photo-section">
                <img id="pilotPhoto" class="pilot-photo" src="../img/pilot.png">
            </div>

        </div>

    </div>

<script>

function update(data){
    /* CasparCG 2.5 entrega el payload del CG ADD/UPDATE como texto JSON,
       no como objeto. Sin este parseo data.<campo> siempre era undefined
       y la plantilla se quedaba con sus valores por defecto. */

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }


    if(data.pilot_name !== undefined)
        document.getElementById("pilotName").textContent =
            data.pilot_name;

    /* Sin dorsal no se pinta ni la almohadilla. En drag hay carros sin
       numero, y un "#" solo se lee como un dato que no cargo. */
    if(data.car_number !== undefined){

        const el = document.getElementById("carNumber");

        el.textContent = data.car_number ? "#" + data.car_number : "";
        el.style.display = data.car_number ? "block" : "none";
    }

    if(data.category !== undefined)
        document.getElementById("category").textContent =
            data.category;

    /* Sin subcategoría el bloque entero se esconde, etiqueta incluida:
       una etiqueta sin dato se lee como un fallo de carga. */
    if(data.sub_category !== undefined){

        const el = document.getElementById("subCategory");

        el.textContent = data.sub_category || "";
        el.closest(".info-block").style.display = data.sub_category ? "flex" : "none";
    }

    if(data.vehicle !== undefined)
        document.getElementById("vehicle").textContent =
            data.vehicle;

    if(data.team !== undefined)
        document.getElementById("team").textContent =
            data.team;

    /* El pais llega como codigo ISO ("pa") y se pinta como bandera, no
       como palabra: se lee de un vistazo y no hay que traducirla ni
       preocuparse de que "Republica Dominicana" no quepa en la carta.

       La bandera se lee del disco, junto a la plantilla. No pasa por el
       backend como la foto del piloto: si el backend se cae, la carta
       sigue saliendo con su bandera. */
    if(data.country !== undefined){

        const el = document.getElementById("country");
        const codigo = (data.country || "").toLowerCase();

        el.src = codigo ? "../img/banderas/" + codigo + ".svg" : "";

        /* Sin pais se esconde el bloque entero, etiqueta incluida: una
           etiqueta sola se lee como un fallo de carga. */
        el.closest(".info-block").style.display = codigo ? "flex" : "none";
    }

    if(data.brand_logo !== undefined)
        document.getElementById("brandLogo").src =
            data.brand_logo;

    if(data.pilot_photo !== undefined)
        document.getElementById("pilotPhoto").src =
            data.pilot_photo;
}

function play(){

    const overlay =
        document.getElementById("pilotShort");

    const panel =
        document.getElementById("pilotPanel");

    overlay.style.animation =
        "slideUp .5s ease forwards";

    setTimeout(() => {

        panel.style.animation =
            "expandPanel .6s ease forwards";

    },500);
}

function stop(){

    const overlay =
        document.getElementById("pilotShort");

    const panel =
        document.getElementById("pilotPanel");

    panel.style.animation =
        "collapsePanel .5s ease forwards";

    setTimeout(() => {

        overlay.style.animation =
            "slideDown .5s ease forwards";

    },500);
}

/* SOLO PRUEBA */

window.onload = function(){

    /* Sin update() de prueba: CasparCG manda los datos reales con el
       CG ADD, y si aqui se volvieran a escribir se perderian. */

    play();

};

</script>

</body>
</html>
