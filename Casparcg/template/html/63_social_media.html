<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Social Media</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/social_media.css">

    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/entrada.js"></script>
</head>

<body>

    <div
        class="social-media"
        id="socialMedia">

        <!-- PANEL LOGO -->

        <div class="logo-box">

            <img
                id="logo"
                src="../img/logo-cliente.png"
                alt="Autódromo Panamá">

        </div>

        <!-- PANEL INFORMACIÓN -->

        <div
            class="info-panel"
            id="infoPanelSocialMedia">

            <div class="content-section">

                <!-- INSTAGRAM -->

                <div class="social-row">

                    <svg
                        class="social-icon"
                        viewBox="0 0 24 24"
                        aria-label="Instagram">

                        <rect
                            x="2.5" y="2.5"
                            width="19" height="19"
                            rx="5.5"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="2"/>

                        <circle
                            cx="12" cy="12" r="4.5"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="2"/>

                        <circle
                            cx="17.6" cy="6.4" r="1.4"
                            fill="#ffffff"/>

                    </svg>

                    <span
                        class="social-value"
                        id="instagram">

                        @autodromopanama

                    </span>

                </div>

                <!-- YOUTUBE -->

                <div class="social-row">

                    <svg
                        class="social-icon"
                        viewBox="0 0 24 24"
                        aria-label="YouTube">

                        <rect
                            x="1.8" y="5"
                            width="20.4" height="14"
                            rx="4.5"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="2"/>

                        <path
                            d="M10.3 8.9 L16.2 12 L10.3 15.1 Z"
                            fill="#ffffff"/>

                    </svg>

                    <span
                        class="social-value"
                        id="youtube">

                        @Autodromo Panama

                    </span>

                </div>

                <!-- WEBSITE -->

                <div class="social-row">

                    <svg
                        class="social-icon"
                        viewBox="0 0 24 24"
                        aria-label="Website">

                        <circle
                            cx="12" cy="12" r="9.5"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="2"/>

                        <ellipse
                            cx="12" cy="12" rx="4.2" ry="9.5"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="2"/>

                        <path
                            d="M2.9 9 H21.1 M2.9 15 H21.1"
                            stroke="#ffffff"
                            stroke-width="2"/>

                    </svg>

                    <span
                        class="social-value"
                        id="website">

                        autodromopanama.com

                    </span>

                </div>

            </div>

        </div>

    </div>

<script>

function update(data){
    /* CasparCG 2.5 entrega el payload del CG ADD/UPDATE como texto JSON,
       no como objeto. Sin este parseo data.<campo> siempre era undefined
       y la plantilla se quedaba con sus valores por defecto. */

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }


    if(data.instagram !== undefined)
        document.getElementById("instagram").textContent =
            data.instagram;

    if(data.youtube !== undefined)
        document.getElementById("youtube").textContent =
            data.youtube;

    if(data.website !== undefined)
        document.getElementById("website").textContent =
            data.website;

    if(data.logo !== undefined)
        document.getElementById("logo").src =
            data.logo;
}

function play(){
    entradaCancelarAuto();

    /* Se espera a que la tipografia este cargada y las imagenes
       completas antes de desplegar. Sin esto la barra se abria vacia y
       el logo aparecia de golpe a mitad de la animacion; el clima se veia
       bien porque es la unica sin imagenes. Hay tope: si algo no llega,
       la barra sale igual sin esa pieza. */
    entradaCuandoListo(document.body, () => {

        const widget = document.getElementById("socialMedia");
        const panel  = document.getElementById("infoPanelSocialMedia");

        widget.style.animation = "slideUp .5s ease forwards";

        setTimeout(() => {
            panel.style.animation = "expandPanel .6s ease forwards";
        }, 500);
    });
}

function stop(){

    const widget =
        document.getElementById("socialMedia");

    const panel =
        document.getElementById("infoPanelSocialMedia");

    panel.style.animation =
        "collapsePanel .5s ease forwards";

    setTimeout(() => {

        widget.style.animation =
            "slideDown .5s ease forwards";

    },500);
}

/* Arranque automatico solo para verlo en un navegador. Dentro de
   CasparCG el CG ADD llama a play() antes de que salte, y play() lo
   cancela: sin esto la barra salia primero con el texto de relleno
   y volvia a entrar al llegar los datos, que es el amague. */
window.onload = function(){
    entradaAutoNavegador(play);
};

</script>

</body>
</html>
