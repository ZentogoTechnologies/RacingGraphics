<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carta VS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/pilot_vs.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="vs-card" id="vsCard">

        <div class="vs-lado izq">
            <div class="vs-foto"><img id="fotoA" src="" alt=""></div>
            <div class="vs-datos">
                <div class="vs-nombre-fila">
                    <span class="vs-nombre" id="nombreA">ROBERTO REYNA</span>
                </div>
                <div class="vs-carro" id="carroA">
                    <span class="marca">HONDA</span> CIVIC TYPE R
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo" data-t="carta.mejor">Mejor</span> <span id="mejorA">1:23.456</span>
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo" data-t="carta.ultima">Última</span> <span id="ultimaA">1:24.902</span>
                </div>
            </div>
        </div>

        <div class="vs-centro"><span></span></div>

        <div class="vs-lado der">
            <div class="vs-foto"><img id="fotoB" src="" alt=""></div>
            <div class="vs-datos">
                <div class="vs-nombre-fila">
                    <span class="vs-nombre" id="nombreB">LUIS MOTO MOTO</span>
                </div>
                <div class="vs-carro" id="carroB">
                    <span class="marca">TOYOTA</span> COROLLA GR
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo" data-t="carta.mejor">Mejor</span> <span id="mejorB">1:23.918</span>
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo" data-t="carta.ultima">Última</span> <span id="ultimaB">1:24.115</span>
                </div>
            </div>
        </div>

    </div>

<script>
function txt(id,v){ const e=document.getElementById(id); if(e&&v!==undefined) e.textContent=v; }

function carro(id, marca, modelo){
    const e=document.getElementById(id); if(!e) return;
    const m=(marca||"").toUpperCase(), mo=(modelo||"").toUpperCase();
    e.innerHTML = m ? `<span class="marca">${m}</span> ${mo}` : mo;
}

function foto(id,url){
    const e=document.getElementById(id); if(!e||url===undefined) return;
    if(url){ e.src=url; e.style.visibility="visible"; }
    else   { e.removeAttribute("src"); e.style.visibility="hidden"; }
}

function nombre(n,a){ return [n,a].filter(Boolean).join(" ").toUpperCase(); }

function update(data){
    try{
        const d = typeof data==="string" ? JSON.parse(data) : (data||{});
        for(const s of ["a","b"]){
            const S=s.toUpperCase();
            if(d["name_"+s]!==undefined||d["last_name_"+s]!==undefined)
                txt("nombre"+S, nombre(d["name_"+s], d["last_name_"+s]));
            if(d["brand_"+s]!==undefined||d["model_"+s]!==undefined)
                carro("carro"+S, d["brand_"+s], d["model_"+s]);
            /* Sin cronometraje se pone un guion y no se deja en blanco:
               un hueco vacio parece que la carta se rompio. */
            if(d["best_time_"+s]!==undefined) txt("mejor"+S, d["best_time_"+s] || "--");
            if(d["last_time_"+s]!==undefined) txt("ultima"+S, d["last_time_"+s] || "--");
            foto("foto"+S, d["photo_"+s]);
        }
    }catch(e){}
}

/* ==========================================================================
   ENTRADA

   Las dos caras entran juntas en el centro y desde ahi se abren hacia sus
   lados, descubriendo la informacion que va en medio.

   Lo que se mueve no son las fotos: es lo que hay entre ellas, que empieza
   sin ancho y lo recupera. Como la carta esta centrada en pantalla, las
   caras se juntan y se separan solas. Asi no hay nada que medir, que es
   donde fallaba antes: CasparCG llama a play() cuando el navegador aun no
   ha hecho el diseño y las medidas salian mal.
========================================================================== */

function play(){

    const carta = document.getElementById("vsCard");

    carta.style.transform = "translateX(-50%)";
    carta.style.animation = "slideUp .5s ease forwards";

    /* Sin ancho en el centro desde el primer fotograma: es el punto de
       partida, no un movimiento. */
    carta.classList.remove("abriendo");
    carta.classList.add("juntas");

    /* Se abre cuando la carta ha terminado de subir y las dos caras estan
       cargadas. Sin esperar a las fotos, el momento en que deberian verse
       juntas se lo pasan como dos cajas negras sobre un panel negro: se
       separan antes de que haya nada que mirar. */
    cuandoEsten(carta.querySelectorAll(".vs-foto img"), () => {
        setTimeout(() => {
            /* Dos fotogramas para que el navegador registre el estado
               cerrado antes de soltarlo, o se salta la transicion. */
            requestAnimationFrame(() => requestAnimationFrame(() => {
                carta.classList.add("abriendo");
            }));
        }, 620);
    });
}

function stop(){

    const carta = document.getElementById("vsCard");
    carta.style.animation = "slideDown .5s ease forwards";

    /* Se limpia para que la proxima vez vuelva a entrar juntandose y no
       desde donde se quedo. */
    setTimeout(() => {
        carta.classList.remove("juntas", "abriendo");
    }, 500);
}


/* Llama a `seguir` cuando todas las imagenes hayan cargado, y en todo caso
   al cabo de un segundo y medio: una foto que no llegue no puede dejar la
   carta congelada a medio entrar. */
function cuandoEsten(imagenes, seguir){

    const lista = Array.from(imagenes).filter(im => im.getAttribute("src"));

    let pendientes = lista.filter(im => !im.complete).length;
    let hecho = false;

    const listo = () => {
        if (hecho) return;
        hecho = true;
        seguir();
    };

    if (!pendientes) { listo(); return; }

    lista.forEach(im => {
        if (im.complete) return;
        const marcar = () => { if (--pendientes <= 0) listo(); };
        im.addEventListener("load", marcar, { once: true });
        im.addEventListener("error", marcar, { once: true });
    });

    setTimeout(listo, 1500);
}

if(!window.__casparcg){ play(); }
</script>

</body>
</html>
